t style="overflow: visible; text-align: left;" pointer-events="none" x="-9950" y="-9650" width="20450" height="20116"><div style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 452px; height: 1px; padding-top: 10000px; margin-left: 10000px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; color: #1C1917; "><div style="display: inline-block; font-size: 11px; font-family: Helvetica; color: light-dark(#1C1917, #dad7d6); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">Sin claves foráneas: personas y planes viven en otros servicios. Cada cierre de check-in añade una línea por persona del grupo; un evento repetido no la duplica (clave primaria y ON CONFLICT DO NOTHING). El historial de alguien sale en una sola consulta: planes organizados que se celebraron, planes a los que llegó, sus actividades distintas y la racha desde su última ausencia a un plan celebrado. Una insignia se consigue una vez (clave primaria) y no se pierde.</div></div></div></foreignObject></g></g></g><g></g><g></g></g></svg>
