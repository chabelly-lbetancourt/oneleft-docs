/g><g style=""><g><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" x="-9450" y="-9725" width="20280" height="20146"><div style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 282px; height: 1px; padding-top: 10000px; margin-left: 10000px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; color: #1C1917; "><div style="display: inline-block; font-size: 11px; font-family: Helvetica; color: light-dark(#1C1917, #dad7d6); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">Una fila por persona y plan: quien organiza o participa, desde 15 min antes del inicio hasta 30 min después y a menos de 150 m del punto de encuentro. Repetir el check-in devuelve el primero. Solo se guarda quién llegó y cuándo, nunca dónde estaba: PostGIS compara la ubicación del móvil con el punto del plan y la descarta. La asistencia servirá para la reputación (HU-009) y se borra con el plan.</div></div></div></foreignObject></g></g></g><g></g><g></g></g></svg>
