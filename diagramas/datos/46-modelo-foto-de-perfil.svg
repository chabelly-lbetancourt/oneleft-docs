nt: unsafe flex-start; width: 342px; height: 1px; padding-top: 10000px; margin-left: 10000px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; color: #1C1917; "><div style="display: inline-block; font-size: 11px; font-family: Helvetica; color: light-dark(#1C1917, #dad7d6); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">La foto no está en la base de datos: users solo guarda dónde está. Sin clave foránea a profile, porque se puede subir una foto antes de que exista el perfil. Cada subida tiene una clave nueva y aleatoria, así que nadie adivina ni confirma la foto de otra persona; al confirmar una foto se borran la anterior y las subidas sin confirmar. El bucket es privado: las fotos solo se ven con enlaces firmados que caducan en una hora.</div></div></div></foreignObject></g></g></g><g></g><g></g></g></svg>
