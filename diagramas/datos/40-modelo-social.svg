afe flex-start; width: 342px; height: 1px; padding-top: 10000px; margin-left: 10000px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; color: #1C1917; "><div style="display: inline-block; font-size: 11px; font-family: Helvetica; color: light-dark(#1C1917, #dad7d6); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">Cada follow une a dos personas: quien sigue (follower_id) y a quién (followee_id). Base de datos social: sin claves foráneas a otros servicios. Las personas y los planes viven en users y plans; social guarda una copia del nombre, que se actualiza cada vez que la persona usa el servicio. El nombre de alguien nuevo se pregunta una sola vez a users. Las listas (seguidores, seguidos, solicitudes) se leen con los nombres en una sola consulta.</div></div></div></foreignObject></g></g></g><g></g><g></g></g></svg>
