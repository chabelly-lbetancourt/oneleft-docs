erecho de supresión y limpieza de los tests). Un evento repetido da el mismo apunte una sola vez (UNIQUE). La puntuación se actualiza en la misma transacción que cada apunte nuevo y se recalcula sumando el libro.</div></div></div></foreignObject></g></g></g><g></g><g></g></g></svg>
