0 L 460 390 L 460 200 Z" fill="#f5f5f4" stroke="#a8a29e" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(245, 245, 244), rgb(26, 26, 25)); stroke: light-dark(rgb(168, 162, 158), rgb(101, 96, 93));"></path><path d="M 726 200 L 726 214 L 740 214" fill="none" stroke="white" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(168, 162, 158), rgb(101, 96, 93));" visibility="hidden" stroke-width="9" vector-effect="non-scaling-stroke"></path><path d="M 726 200 L 726 214 L 740 214" fill="none" stroke="#a8a29e" stroke-miterlimit="10" pointer-events="all" style="stroke: light-dark(rgb(168, 162, 158), rgb(101, 96, 93));"></path></g><g style=""><g><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" x="-9530" y="-9705" width="20260" height="20186"><div style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 262px; height: 1px; padding-top: 10000px; margin-left: 10000px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; color: #1C1917; "><div style="display: inline-block; font-size: 11px; font-family: Helvetica; color: light-dark(#1C1917, #dad7d6); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">Quien organiza un plan que aún no ha empezado ve a la gente libre a menos de 5 km que haría su actividad, como FreePerson: distancia redondeada a 500 m desde la zona aproximada, nivel en la actividad y otras actividades. Nunca el user_id, el nombre ni el lugar. La fila se borra al desactivar, al unirse a un plan (también desde la lista de espera) y, caducada, por la limpieza cada 10 minutos.</div></div></div></foreignObject></g></g></g><g></g><g></g></g></svg>
